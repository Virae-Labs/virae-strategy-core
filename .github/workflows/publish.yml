name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (must match package.json, for example 0.7.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.version || github.ref_name }}
    runs-on: ubuntu-latest
    environment: NPM_TOKEN
    steps:
      - uses: actions/checkout@v5

      - name: Verify release version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            release_version="${GITHUB_REF_NAME#v}"
            release_source="Tag $GITHUB_REF_NAME"
          else
            release_version="$REQUESTED_VERSION"
            release_source="Requested version $REQUESTED_VERSION"
          fi
          if [[ "$release_version" != "$package_version" ]]; then
            echo "$release_source does not match package.json version $package_version" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Validate package
        run: npm run check

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
