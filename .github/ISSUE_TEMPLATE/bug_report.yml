name: Bug report
description: Report a reproducible strategy, API, packaging, or documentation defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include private keys, tokens, signatures, user data, or confidential production configuration.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.0.2
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Entry decision or diagnostics
        - Execution or chase policy
        - Exit policy
        - Lifecycle reducer
        - TypeScript or package exports
        - Documentation
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Minimal normalized fixture
      description: Provide a sanitized input and the exact function call.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety confirmation
      options:
        - label: The report contains no secrets, credentials, signatures, personal data, or confidential production values.
          required: true
